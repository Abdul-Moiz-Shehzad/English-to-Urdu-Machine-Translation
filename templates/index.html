<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English to Urdu Translator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5 translator-box p-5 shadow-lg rounded">
        <h2 class="mb-4 text-center">🌐 English to Urdu Machine Translator</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="english_text" class="form-label">Enter English Text:</label>
                <textarea class="form-control" id="english_text" name="english_text" rows="4" required>{{ request.form.get('english_text', '') }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Translate</button>
        </form>

        {% if translation %}
        <div class="mt-4">
            <h5>🔁 Translated Urdu:</h5>
            <div class="translated-box mt-2 p-3 rounded">{{ translation }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
